<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video playback · LED studio</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif;
        background: #101014; color: #eeeef4; --muted: #aaaabb; --line: #373742;
        --accent: #d4c1ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(520px, calc(100% - 32px)); }
      .eyebrow { color: var(--accent); font-size: 11px; letter-spacing: .18em;
        text-transform: uppercase; }
      h1 { margin: 9px 0 8px; font-size: 36px; font-weight: 560; letter-spacing: -1.3px; }
      p { color: var(--muted); line-height: 1.6; margin: 0; }
      .card { margin-top: 28px; padding: 28px; border: 1px solid var(--line);
        background: #19191f; border-radius: 18px; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
      button { min-height: 62px; border: 1px solid var(--line); border-radius: 12px;
        color: inherit; background: #24242d; font: inherit; font-size: 17px; cursor: pointer; }
      button:hover, button[aria-pressed="true"] { border-color: var(--accent); background: #30283f; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
      #status { margin-top: 22px; font-size: 13px; }
      #status.live { color: #9de5bd; }
      #status.error { color: #ffafad; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">LED studio / Video</div>
      <h1>Playback</h1>
      <p>The video is enhanced before streaming. These controls only play or pause it.</p>
      <section class="card" aria-label="Video playback controls">
        <div class="actions">
          <button id="play" type="button">▶ Play</button>
          <button id="pause" type="button">Ⅱ Pause</button>
        </div>
        <p id="status" role="status" aria-live="polite">Connecting…</p>
      </section>
    </main>
    <script>
      "use strict";
      const play = document.getElementById("play");
      const pause = document.getElementById("pause");
      const status = document.getElementById("status");
      function render(state) {
        play.setAttribute("aria-pressed", String(state.playing));
        pause.setAttribute("aria-pressed", String(!state.playing));
        if (state.connection !== "live") {
          status.textContent = state.connection === "reconnecting"
            ? "Reconnecting to LED controller…" : "Connecting to LED controller…";
          status.className = "";
        } else {
          status.textContent = state.playing ? "● Playing" : "Ⅱ Paused";
          status.className = "live";
        }
      }
      async function request(path, method = "GET") {
        const response = await fetch(path, { method, signal: AbortSignal.timeout(3000) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Playback control failed");
        return data;
      }
      async function action(name) {
        try { render(await request(`/api/video/${name}`, "POST")); }
        catch (error) { status.textContent = error.message; status.className = "error"; }
      }
      play.addEventListener("click", () => action("play"));
      pause.addEventListener("click", () => action("pause"));
      async function poll() {
        try { render(await request("/api/video/state")); }
        catch (_) { status.textContent = "Video stream is offline"; status.className = "error"; }
        setTimeout(poll, 1000);
      }
      poll();
    </script>
  </body>
</html>
